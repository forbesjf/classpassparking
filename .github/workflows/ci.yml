name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    env:
      # Build-time values only. Every route is server-rendered on demand, so
      # `next build` never connects to the database — a placeholder URL is fine
      # and no Postgres service is needed for CI.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/spotpass?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-not-used-in-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
